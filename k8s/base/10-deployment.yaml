# The Deployment owns the web pods that the HPA will scale horizontally.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: autoscaling-api
  namespace: psi5120-ta1
  labels:
    app.kubernetes.io/name: autoscaling-api
    app.kubernetes.io/part-of: psi5120-ta1
spec:
  # One idle replica establishes the baseline before each load experiment.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: autoscaling-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: autoscaling-api
        app.kubernetes.io/part-of: psi5120-ta1
    spec:
      # A non-root process and read-only root filesystem reduce container privileges.
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Overlays replace this local tag with the ECR address in AWS.
          image: psi5120-autoscaling-api:1.0.0-ta1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_ENV
              value: kubernetes
            # Downward API fields make responses identify the serving pod and node.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            # HPA utilization is calculated relative to this CPU request.
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
